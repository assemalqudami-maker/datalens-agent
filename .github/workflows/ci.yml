name: Tests and MCP integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t datalens:ci .
      - name: Check application health (not provider connectivity)
        run: |
          docker run -d --name datalens -p 8501:8501 datalens:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs datalens
          exit 1
