name: Live Gemini evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-evaluation
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      DATALENS_DATA_DIR: runtime/live-eval
      DATALENS_TASK_BUDGET_USD: '0.10'
      DATALENS_DAILY_BUDGET_USD: '1.00'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run real provider cases (fails clearly if no key)
        run: python scripts/live_eval.py --output live-results
      - name: Preserve original traces, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-evidence
          path: live-results/
          retention-days: 30
